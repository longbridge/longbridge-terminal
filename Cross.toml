# Release builds for Linux go through cross (see .github/workflows/release.yml).
# A git build of cross pulls the floating `:main` images, so pin them by digest
# to keep release toolchains reproducible. When bumping, update the cross
# `--rev` in release.yml together with these digests:
#   docker buildx imagetools inspect ghcr.io/cross-rs/<target>:main

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu@sha256:8859395961030cc16506872272a547dce07126daf69007d492cb28217d37cd28"

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:4043a111de4bdb21628be33eb1a9e90dcfcb07ea96ed9df43bb2e9be53b32a05"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:036102224c8bbdb0c55b1f513e6436de5dcae5106130549b77815e16218383a1"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:8b7fd8ef9ea82f0687baeeec281e1bc2667d84d5f4d65c8720636f1a2daf9c2f"
