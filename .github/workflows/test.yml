name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

# Cancel a pull request's earlier runs when a new commit supersedes them.
# Follows the grouping style already used by test-update.yml.
#
# `head_ref` is set only for pull_request events, so a PR groups by its branch
# and a new push cancels the run for the commit it replaced. A push to main or
# a tag falls back to `run_id`, which is unique per run, so those get a group
# of their own: never cancelled, and never queued behind each other.
concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup | Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-test-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test
        run: make test
