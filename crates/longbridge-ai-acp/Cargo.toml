[package]
name = "longbridge-ai-acp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Embeddable ACP bridge for Longbridge AI agents"

[dependencies]
agent-client-protocol = "2.0.0"
async-trait = "0.1"
futures = "0.3"
longbridge = { git = "https://github.com/longbridge/openapi.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
